<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto DentTerrassa</title>
    <link rel="icon" href="../dental/imagenes/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="reset/css" href="css/reset.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" type="text/css" href="css/fonts.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="css/contacte.css">

</head>

<body>
    <!-- header -->
    <header class="container-fluid header-main">
        <div class="container">
            <section class="row ">
                <div class="col-12 m-0 menu">
                    <div class="col-2 logo-section">
                        <a href="index.html" target="_blank">
                            <figure class="logo m-0">
                                <img src="imagenes/logoheader.svg" alt="logoheader">
                            </figure>
                        </a>
                    </div>
                    <nav class="col-5 menu-nav">
                        <ul class="nav-list m-0">
                            <li class="nav-item"><a class="nav-link" target="_blank" href="sevicios.html">Servicios</a>
                            </li>
                            <li class="line__menu"></li>
                            <li class="nav-item line-item"><a class="nav-link" target="_blank"
                                    href="galeria.html">Galería</a></li>
                            <li class="line__menu"></li>
                            <li class="nav-item"><a class="nav-link" target="_blank" href="contacte.html">Contacto</a>
                            </li>
                        </ul>
                    </nav>
                    <div class="col-2 search-section ">
                        <input type="search" class="search-input" placeholder="Busca en DentTerrassa">
                    </div>
                    <div class="col-1 social-section">
                        <a href="#" target="_blank" class="social-link redes" aria-label="WhatsApp DentTerrassa">
                            <img src="imagenes/whatsappiacon.svg" alt="whatsapp">
                        </a>
                        <a href="#" target="_blank" class="social-link redes" aria-label="Instagram">
                            <img src="imagenes/instagramiacon.svg" alt="Instagram DentTerrassa">
                        </a>
                    </div>
                    <div class="col-2 login-section">
                        <a href="iniciar.html" class="boton">Iniciar Sesión</a>
                    </div>
                </div>
            </section>
        </div>
    </header>
    <section class="continer-fluid fondo__block1">
        <section class="container">
            <div class="row">
                <div class="col-12 section__block1">
                    <h1>CONTACTO </h1>
                    <div class="wraper__contacto col-7">
                        <div class="col-6">
                            <form action="">
                                <input type="text" name="name" id="name" placeholder="Nombre Completo" required>
                                <input type="email" name="email" id="email" placeholder="Correo Electronico" required>
                                <input type="text" name="asunto" id="asunto" placeholder="Asunto">
                                <textarea type="text-area" name="message" id="message" placeholder="Mensaje"></textarea>
                                <div class="buttons__formulario">
                                    <button class="boton  boton-formuraio">Enviar</button>
                                    <button class="boton boton-formuraio">Borrar</button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
            <footer>
                <div class="row">
                    <div class="col-12">
                        <div class="line__footer"></div>
                        <div class="footer__horariomapa">
                            <div class="col-4 horario">
                                <figure><img src="imagenes/horario.svg" alt="horario"></figure>
                                <div class="horariomapa__text">
                                    <h3>Trabajamos sin fines de semana</h3>
                                    <p>De 8:00 a 20:00, sáb hasta 18:00</p>
                                </div>
                            </div>
                            <div class="col-3 logofooter">
                                <figure><img src="imagenes/logofooter.svg" alt="logo"></figure>
                            </div>
                            <div class="col-4 dericcion">
                                <figure><img src="imagenes/mapa.svg" alt="mapa"></figure>
                                <div class="horariomapa__text">
                                    <h3>Nos encontramos en:</h3>
                                    <p>Carrer de Sant Antoni, 123, Terrassa</p>
                                </div>
                            </div>
                        </div>
                    </div>
    
                    <div class="col-12 section__footer__info">
                        <span class="footer__info">
                            © DentTerrassa 2026
                        </span>
                    </div>
                    <div class="col-12 section__footer">
                        <div class="col-4">
                            <a href="#" class="nav-link" target="_blank">Politica de privacidad</a>
                        </div>
                        <div class="col-4">
                            <p class="creadora">By<span> Aleksandra Iuzhakov</span> - <span>CIFO 2026</span></p>
                        </div>
                        <div class="col-4">
                            <a href="#" class="nav-link" target="_blank">Aviso legal</a>
                        </div>
                    </div>
                </div>
    
            </footer>
        </section>
    </section>
</body>

</html>
